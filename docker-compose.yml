services:
  postgres:
    image: postgres:16-alpine
    container_name: sitrib-postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: sitrib
      POSTGRES_PASSWORD: sitrib_secret_password
      POSTGRES_DB: sitrib
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitrib -d sitrib"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      sitrib-network:
        aliases:
          - postgres
          - sitrib-postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sitrib-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://sitrib:sitrib_secret_password@sitrib-postgres:5432/sitrib
      SITRIB_GATEWAY_URL: http://localhost:8000
      SITRIB_AUTH_API_URL: http://localhost:8000/api/v1/auth
      SITRIB_TRIBUTARIO_API_URL: http://localhost:8000/api/v1
      SITRIB_TRANSPARENCIA_API_URL: http://localhost:8000/api/v1
      SITRIB_IA_PREDICAO_API_URL: http://localhost:8000/api/v1
    ports:
      - "8000:8000"
    volumes:
      - ./data/bruto:/app/data/bruto
      - ./data/limpo:/app/data/limpo
      - ./data/pronto:/app/data/pronto
    networks:
      - sitrib-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sitrib-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_AUTH_API_URL: http://localhost:8000/api/v1/auth
      VITE_TRIBUTARIO_API_URL: http://localhost:8000/api/v1
      VITE_TRANSPARENCIA_API_URL: http://localhost:8000/api/v1
      VITE_IA_PREDICAO_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    networks:
      - sitrib-network

volumes:
  pgdata:

networks:
  sitrib-network:
    driver: bridge

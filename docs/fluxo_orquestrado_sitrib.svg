<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-service" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-struct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-db" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-gov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- Título do Diagrama -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="0.5">SITRIB — ARQUITETURA ORQUESTRADA DO SISTEMA</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Fluxo Completo de Integração: Frontend • Controllers • Estruturas de Memória • Banco &amp; APIs</text>

  <!-- 1. Camada de Apresentação (Frontend) -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="900" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="70" y="122" width="260" height="46" rx="8" fill="url(#grad-user)"/>
    <text x="200" y="145" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Frontend Web (React 19)</text>
    <text x="200" y="160" text-anchor="middle" fill="#e0e7ff" font-size="10">Dashboard • Busca • Cobrança • Simulador</text>

    <text x="500" y="150" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="600">⇄  Comunicação RESTful JSON / HTTP  ⇄</text>

    <rect x="670" y="122" width="260" height="46" rx="8" fill="#334155"/>
    <text x="800" y="145" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Controllers / API Gateway</text>
    <text x="800" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">Validação de entrada, rotas e autorização RBAC</text>
  </g>

  <!-- Seta Conectora para os Serviços -->
  <line x1="800" y1="180" x2="800" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="180" x2="200" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Camada de Negócio e Serviços Orquestradores -->
  <g filter="url(#shadow)">
    <rect x="50" y="230" width="900" height="85" rx="12" fill="#1e293b" stroke="#047857" stroke-width="2"/>
    <rect x="65" y="245" width="260" height="55" rx="8" fill="url(#grad-service)"/>
    <text x="195" y="270" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">BuscaService</text>
    <text x="195" y="287" text-anchor="middle" fill="#ecfdf5" font-size="11">Validação de CPF/CNPJ &amp; Dossiê Imóvel</text>

    <rect x="370" y="245" width="260" height="55" rx="8" fill="url(#grad-service)"/>
    <text x="500" y="270" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CalculoService &amp; Simulacao</text>
    <text x="500" y="287" text-anchor="middle" fill="#ecfdf5" font-size="11">Alíquotas de IPTU/ISS &amp; Projeção Financeira</text>

    <rect x="675" y="245" width="260" height="55" rx="8" fill="url(#grad-service)"/>
    <text x="805" y="270" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">CobrancaOrquestrador</text>
    <text x="805" y="287" text-anchor="middle" fill="#ecfdf5" font-size="11">Score de Risco &amp; Notificações Automáticas</text>
  </g>

  <!-- Setas para Camada de Memória (Estruturas) -->
  <line x1="195" y1="315" x2="195" y2="365" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="500" y1="315" x2="500" y2="365" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="805" y1="315" x2="805" y2="365" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 3. Camada de Estruturas de Dados Avançadas (src/estruturas/) -->
  <g filter="url(#shadow)">
    <rect x="50" y="370" width="900" height="115" rx="12" fill="#1e293b" stroke="#6d28d9" stroke-width="2"/>
    <text x="75" y="395" fill="#c084fc" font-size="12" font-weight="800" letter-spacing="1">CAMADA EM MEMÓRIA — ALTA PERFORMANCE ASSINTÓTICA (SPRINT 2)</text>

    <!-- Tabela Hash -->
    <rect x="70" y="408" width="265" height="62" rx="8" fill="url(#grad-struct)"/>
    <text x="202" y="430" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">TabelaHashDivida — O(1)</text>
    <text x="202" y="445" text-anchor="middle" fill="#f3e8ff" font-size="10">Indexa débitos por CPF para resposta</text>
    <text x="202" y="458" text-anchor="middle" fill="#f3e8ff" font-size="10">instantânea sem bater no disco</text>

    <!-- Fila Heap -->
    <rect x="367" y="408" width="265" height="62" rx="8" fill="url(#grad-struct)"/>
    <text x="500" y="430" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">FilaCobranca (Max-Heap) — O(log n)</text>
    <text x="500" y="445" text-anchor="middle" fill="#f3e8ff" font-size="10">Mantém sempre no topo o devedor de maior</text>
    <text x="500" y="458" text-anchor="middle" fill="#f3e8ff" font-size="10">score de risco sem reordenar a base</text>

    <!-- Grafo -->
    <rect x="665" y="408" width="265" height="62" rx="8" fill="url(#grad-struct)"/>
    <text x="797" y="430" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">GrafoContribuintes — O(1)</text>
    <text x="797" y="445" text-anchor="middle" fill="#f3e8ff" font-size="10">Mapeia Contribuinte ➔ Imóvel ➔ Processos</text>
    <text x="797" y="458" text-anchor="middle" fill="#f3e8ff" font-size="10">detectando blindagem e patrimônio oculto</text>
  </g>

  <!-- Setas Conectoras com Banco de Dados e APIs -->
  <line x1="202" y1="485" x2="330" y2="540" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="500" y1="485" x2="400" y2="540" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="797" y1="485" x2="680" y2="540" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 4. Camada de Persistência e Integrações Externas -->
  <g filter="url(#shadow)">
    <!-- Banco de Dados -->
    <rect x="80" y="540" width="400" height="95" rx="12" fill="#1e293b" stroke="#d97706" stroke-width="2"/>
    <rect x="95" y="555" width="60" height="65" rx="8" fill="url(#grad-db)"/>
    <text x="125" y="595" text-anchor="middle" fill="#ffffff" font-size="24">🗄️</text>
    <text x="170" y="575" fill="#fef3c7" font-size="14" font-weight="700">Banco de Dados Relacional</text>
    <text x="170" y="593" fill="#cbd5e1" font-size="11">Tabelas: Contribuintes • Imóveis • Dívidas • Processos</text>
    <text x="170" y="610" fill="#f59e0b" font-size="10" font-weight="600">Integridade referencial com Chaves Estrangeiras (FKs)</text>

    <!-- APIs Externas da Prefeitura -->
    <rect x="520" y="540" width="400" height="95" rx="12" fill="#1e293b" stroke="#0891b2" stroke-width="2"/>
    <rect x="535" y="555" width="60" height="65" rx="8" fill="url(#grad-gov)"/>
    <text x="565" y="595" text-anchor="middle" fill="#ffffff" font-size="24">🏛️</text>
    <text x="610" y="575" fill="#cffafe" font-size="14" font-weight="700">APIs da Prefeitura de Palmas / CND</text>
    <text x="610" y="593" fill="#cbd5e1" font-size="11">Segurança: HTTPS/TLS 1.3 • Token JWT • Rate-Limiting</text>
    <text x="610" y="610" fill="#06b6d4" font-size="10" font-weight="600">Conformidade LGPD com Mascaramento de Dados</text>
  </g>
</svg>
